<ul class="expenses-list list-group">
  <li class="list-group-item" *ngFor="let expense of expenses">
    <div class="d-flex justify-content-between align-items-center">
      <div>
        <strong>{{ expense.reason }}</strong>
        <span class="badge bg-secondary ms-2">{{ expense.category }}</span>
        <span *ngIf="expense.necessary" class="badge bg-success ms-1">Necesario</span>
      </div>
      <div class="text-end">
        <span class="fw-bold">{{ expense.amount }}€</span>
        <small class="d-block text-muted">{{ expense.date | date:'dd/MM/yyyy' }}</small>
      </div>
    </div>
    <small *ngIf="expense.notes" class="text-muted fst-italic">{{ expense.notes }}</small>
  </li>
</ul>
