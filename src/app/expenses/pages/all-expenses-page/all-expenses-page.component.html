<div class="p-3">
  <h4>Todos los gastos</h4>
  <hr>

  <div *ngIf="isLoading" class="d-flex justify-content-center p-4">
    <div class="spinner-border text-success" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
  </div>

  <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

  <ng-container *ngIf="!isLoading && !errorMessage">
    <p *ngIf="expenses.length === 0" class="text-center">No hay gastos registrados.</p>
    <expenses-list *ngIf="expenses.length > 0" [expenses]="expenses"></expenses-list>
  </ng-container>
</div>
